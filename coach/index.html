<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Voice Coach" />
  <title>Voice Coach · AI 음성 회화 루틴</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="coach.css" />
</head>
<body>
  <header class="topbar">
    <a class="icon-btn" href="../" title="문장 암기 앱" aria-label="문장 암기 앱">📚</a>
    <div class="brand">
      <strong>Voice Coach</strong>
      <span id="subtitle">AI 음성 회화 · 오답이 쌓이는 루틴</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정">⚙️</button>
  </header>

  <main id="app"><!-- rendered by app.js --></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today" class="on">🎯<span>오늘</span></button>
    <button data-tab="record">📥<span>기록</span></button>
    <button data-tab="drill">🗣<span>복습</span></button>
    <button data-tab="stats">📈<span>통계</span></button>
  </nav>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="settingsDrawer" hidden aria-label="설정"></aside>
  <div class="toast" id="toast" hidden></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
