<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>English Grammar in Use · 하루 20문장</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>" />
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="homeBtn" title="홈" aria-label="홈">🏠</button>
    <div class="brand">
      <strong>Grammar in Use</strong>
      <span id="subtitle">하루 20문장 · 듣고 따라 말하기</span>
    </div>
    <button class="icon-btn" id="settingsBtn" title="설정" aria-label="설정">⚙️</button>
  </header>

  <main id="app"><!-- rendered by app.js --></main>

  <!-- Settings drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <aside class="drawer" id="settingsDrawer" hidden aria-label="설정">
    <h2>설정</h2>
    <label class="field">
      <span>음성 (Voice)</span>
      <select id="voiceSelect"></select>
    </label>
    <label class="field">
      <span>속도 <b id="rateVal">1.0×</b></span>
      <input type="range" id="rateRange" min="0.5" max="1.3" step="0.05" value="1" />
    </label>
    <label class="field checkbox">
      <input type="checkbox" id="twiceChk" />
      <span>각 문장 2번 재생 (영상처럼)</span>
    </label>
    <label class="field">
      <span>문장 사이 간격 <b id="gapVal">0.8초</b></span>
      <input type="range" id="gapRange" min="0" max="3" step="0.1" value="0.8" />
    </label>
    <button class="btn ghost" id="testVoiceBtn">🔊 음성 테스트</button>
    <hr />
    <label class="field">
      <span>학습 시작일</span>
      <input type="date" id="startDate" />
    </label>
    <button class="btn danger ghost" id="resetBtn">진도 초기화</button>
    <p class="muted small">진도는 이 브라우저에만 저장됩니다.</p>
  </aside>

  <script src="js/app.js"></script>
</body>
</html>
